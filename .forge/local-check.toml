# Native source-bound gate. The integration branch's policy governs receipts.
base_ref = "origin/main"
allowed_untracked_prefixes = ["research/"]

[schedule.git-diff-check]
cpus = 1
resources = []

[env]
CUDA_VISIBLE_DEVICES = ""
CARGO_BUILD_JOBS = "2"
RUST_TEST_THREADS = "2"
RUSTUP_TOOLCHAIN = "1.98.0"
PYO3_PYTHON = "/nonexistent/forbidden-python"

[[setup]]
name = "resource-preflight"
run = '"$FORGE_CHECK_BIN" task resources --cpus 2 --memory-mib 8192'
timeout_s = 30

[[setup]]
name = "install"
run = 'make install INSTALL_ROOT="$FORGE_INSTALL_ROOT"'
timeout_s = 1800

[[check]]
name = "git-diff-check"
run = 'git diff --check "$FORGE_CHECK_BASE" HEAD'
timeout_s = 30

[[check]]
name = "installed-runtime"
paths = ['^native/', '^Makefile$', '^\.forge/']
run = 'cargo +1.98.0 test --release --offline --locked --jobs 2 --manifest-path native/forge/Cargo.toml --test install_packaging -- --include-ignored'
timeout_s = 900

[[check]]
name = "rust-forge-format"
paths = ['^native/forge/', '^native/forge-cli/', '^\.forge/']
run = 'cargo +1.98.0 fmt --manifest-path native/forge/Cargo.toml --all --check'
timeout_s = 60

[[check]]
name = "rust-forge-clippy"
paths = ['^native/', '^\.forge/', '^Makefile$']
run = 'cargo +1.98.0 clippy --offline --locked --jobs 2 --manifest-path native/forge/Cargo.toml --all-targets -- -D warnings'
timeout_s = 1800

[[check]]
name = "rust-forge-tests"
paths = ['^native/', '^\.forge/', '^Makefile$', '^ledger/']
run = 'cargo +1.98.0 test --release --offline --locked --jobs 2 --manifest-path native/forge/Cargo.toml'
timeout_s = 2400

[[check]]
name = "rust-conductor-format"
paths = ['^native/conductor-native/', '^\.forge/']
run = 'cargo +1.98.0 fmt --manifest-path native/conductor-native/Cargo.toml --check'
timeout_s = 60

[[check]]
name = "rust-conductor-clippy"
paths = ['^native/conductor-native/', '^\.forge/']
run = 'cargo +1.98.0 clippy --offline --locked --jobs 2 --manifest-path native/conductor-native/Cargo.toml --all-targets --features bundled-sqlite,contract-registry -- -D warnings'
timeout_s = 1800

[[check]]
name = "rust-conductor-tests"
paths = ['^native/conductor-native/', '^\.forge/']
run = 'cargo +1.98.0 test --release --offline --locked --jobs 2 --manifest-path native/conductor-native/Cargo.toml --features bundled-sqlite'
timeout_s = 2400

[[check]]
name = "native-contract-registry"
paths = ['^native/conductor-native/', '^Makefile$', '^\.forge/']
run = 'make test-contract-registry'
timeout_s = 2400

[[check]]
name = "rust-slop-format"
paths = ['^native/slop-core/', '^\.forge/']
run = 'cargo +1.98.0 fmt --manifest-path native/slop-core/Cargo.toml --check'
timeout_s = 60

[[check]]
name = "rust-slop-clippy"
paths = ['^native/slop-core/', '^\.forge/']
run = 'cargo +1.98.0 clippy --offline --locked --jobs 2 --manifest-path native/slop-core/Cargo.toml --all-targets -- -D warnings'
timeout_s = 1800

[[check]]
name = "rust-slop-tests"
paths = ['^native/slop-core/', '^\.forge/']
run = 'cargo +1.98.0 test --release --offline --locked --jobs 2 --manifest-path native/slop-core/Cargo.toml'
timeout_s = 1800
