# Native landing policy. This configuration does not create or authorize
# branches or publication by itself.
target = "main"
required_trailers = ["Agent"]
path_prepend = ["target/install/bin"]

[env]
CUDA_VISIBLE_DEVICES = ""
CARGO_BUILD_JOBS = "2"
RUST_TEST_THREADS = "2"
RUSTUP_TOOLCHAIN = "1.98.0"
PYO3_PYTHON = "/nonexistent/forbidden-python"

[[setup]]
name = "install"
run = "make install"
timeout_s = 1800

[[check]]
name = "native-tests"
run = "make test"
paths = ['^native/', '^Makefile$', '^\.forge/', '^ledger/']
timeout_s = 3600

[[check]]
name = "rust-forge"
run = "cargo +1.98.0 fmt --manifest-path native/forge/Cargo.toml --check && cargo +1.98.0 clippy --locked --jobs 2 --manifest-path native/forge/Cargo.toml --all-targets -- -D warnings"
paths = ['^native/', '^\.forge/']
timeout_s = 1800

[[check]]
name = "rust-conductor-native"
run = "cargo +1.98.0 fmt --manifest-path native/conductor-native/Cargo.toml --check && cargo +1.98.0 clippy --locked --jobs 2 --manifest-path native/conductor-native/Cargo.toml --all-targets --features bundled-sqlite -- -D warnings"
paths = ['^native/conductor-native/', '^\.forge/']
timeout_s = 1800

[[check]]
name = "rust-slop-core"
run = "cargo +1.98.0 fmt --manifest-path native/slop-core/Cargo.toml --check && cargo +1.98.0 clippy --locked --jobs 2 --manifest-path native/slop-core/Cargo.toml --all-targets -- -D warnings"
paths = ['^native/slop-core/', '^\.forge/']
timeout_s = 1800
