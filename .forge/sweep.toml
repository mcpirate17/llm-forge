# Native scheduled verification policy. Editing it does not install or start a
# timer. A fresh installation prefix proves artifact relocation without Python;
# cached compiler inputs do not constitute a clean-host build proof.
report_dir = "research/reports/sweep"
calendar = "*-*-* 03:45:00"
launcher = [
  "/usr/bin/systemd-run", "--user", "--scope", "--quiet", "--collect",
  "-p", "MemoryMax=16G", "-p", "MemorySwapMax=0",
  "--", "/usr/bin/timeout", "--kill-after=30", "5400",
]
land_checks = ["native-tests", "rust-forge", "rust-conductor-native", "rust-slop-core"]

[[step]]
name = "toolchain-versions"
run = "cargo +1.98.0 --version && rustc +1.98.0 --version && cargo audit --version"
timeout_s = 60

[[step]]
name = "fresh-prefix-install"
run = 'make install INSTALL_ROOT="$FORGE_SWEEP_OUT/native-install"'
timeout_s = 1800

[[step]]
name = "compilerless-runtime"
run = 'FORGE_INSTALL_ROOT="$FORGE_SWEEP_OUT/native-install" FORGE_TEST_BIN="$FORGE_SWEEP_OUT/native-install/bin/forge" cargo +1.98.0 test --release --offline --locked --jobs 2 --manifest-path native/forge/Cargo.toml --test install_packaging -- --include-ignored'
timeout_s = 900

# cargo-audit is a native test-only tool (development host: 0.22.2). An absent
# audit tool or failed advisory database update is an error, never a clean result.
[[step]]
name = "cargo-audit-forge"
run = "cargo audit --file native/forge/Cargo.lock"
timeout_s = 300

[[step]]
name = "cargo-audit-conductor"
run = "cargo audit --file native/conductor-native/Cargo.lock"
timeout_s = 300

[[step]]
name = "cargo-audit-slop"
run = "cargo audit --file native/slop-core/Cargo.lock"
timeout_s = 300

[[step]]
name = "cargo-audit-product-value"
run = "cargo audit --file native/product-value/Cargo.lock"
timeout_s = 300
