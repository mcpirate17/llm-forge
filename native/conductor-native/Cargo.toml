[package]
name = "conductor-native"
version = "0.1.45"
edition = "2021"
description = "Native core of the conductor agent tooling: mutation campaigns, receipts, evidence and dead-test closure"

[lib]
name = "conductor_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
pyo3 = { version = "0.29", optional = true }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
quick-xml = { version = "0.38", features = ["encoding"] }
ruff_python_ast = { package = "rustpython-ruff_python_ast", version = "0.15.8", optional = true }
ruff_python_parser = { package = "rustpython-ruff_python_parser", version = "0.15.8", optional = true }
ruff_text_size = { package = "rustpython-ruff_text_size", version = "0.15.8", optional = true }
memmap2 = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit", "parsing"], optional = true }
toml = { version = "0.8", optional = true }
zstd = "0.13"

# `extension-module` tells pyo3 not to link libpython, which is right for the
# shipped wheel and wrong for `cargo test` -- a test binary must link it to run.
# Left on unconditionally, the unit tests in this crate cannot even build: they
# fail at link with `undefined symbol: PyObject_CallNoArgs`. The wheel turns it
# back on via `features` in pyproject.toml, so the shipped artifact is unchanged.
# Native consumers disable default features to build the shared core without
# Python bindings or a Python interpreter available during the build.
[features]
default = ["python"]
source-analysis = ["dep:ruff_python_ast", "dep:ruff_python_parser", "dep:ruff_text_size", "dep:syn", "dep:proc-macro2"]
python = ["dep:pyo3", "source-analysis", "dep:memmap2", "dep:toml"]
python-compat-tests = ["python"]
extension-module = ["python", "pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[package.metadata.maturin]
bindings = "pyo3"
