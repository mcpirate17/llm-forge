[package]
name = "conductor-native"
version = "0.1.84"
edition = "2021"
description = "Native core of the conductor agent tooling: mutation campaigns, receipts, evidence and dead-test closure"

[lib]
name = "conductor_native"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "generate_candidate_casefold"
path = "tools/generate_candidate_casefold.rs"
test = true

[[bench]]
name = "vector_index"
harness = false
required-features = ["vector-search"]

[[bench]]
name = "candidate_scan"
harness = false

[[bench]]
name = "candidate_cargo_audit"
harness = false

[[bin]]
name = "dead-code-audit"
path = "src/bin/dead_code_audit.rs"
required-features = ["source-analysis"]

[[bin]]
name = "crg_mcp_probe_child"
path = "tests/fixtures/crg_mcp_probe_child.rs"
required-features = ["python-compat-tests"]
test = false
bench = false

[[bin]]
name = "mutation_support_child"
path = "tests/fixtures/mutation_support_child.rs"
required-features = ["python-compat-tests"]
test = false
bench = false

[dependencies]
anyhow = "1"
cap-std = "4"
ignore = "0.4.34"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
pyo3 = { version = "0.29", optional = true }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
quick-xml = { version = "0.41", features = ["encoding"] }
regex = "1"
# The Python binding shares CPython's dynamic SQLite library; Forge opts into
# bundled-sqlite because its standalone process has no Python SQLite connection.
rusqlite = { version = "0.32", features = ["modern_sqlite", "hooks", "limits"] }
rustsec = { version = "=0.33.0", default-features = false }
libloading = { version = "0.8", optional = true }
libc = "0.2"
ruff_python_ast = { package = "rustpython-ruff_python_ast", version = "0.15.8", optional = true }
ruff_python_parser = { package = "rustpython-ruff_python_parser", version = "0.15.8", optional = true }
ruff_text_size = { package = "rustpython-ruff_text_size", version = "0.15.8", optional = true }
memmap2 = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order", "float_roundtrip"] }
sha1 = { version = "0.10", optional = true }
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit", "parsing"] }
toml = "0.8"
tree-sitter = { version = "0.27", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
unicode-general-category = "=0.6.0"
zstd = "0.14.3"

# `extension-module` tells pyo3 not to link libpython, which is right for the
# shipped wheel and wrong for `cargo test` -- a test binary must link it to run.
# Left on unconditionally, the unit tests in this crate cannot even build: they
# fail at link with `undefined symbol: PyObject_CallNoArgs`. The wheel turns it
# back on via `features` in pyproject.toml, so the shipped artifact is unchanged.
# Default builds have no Python dependency. Legacy bindings are explicit while
# their callers are migrated. Keep Python's shared SQLite runtime separate from
# the standalone Forge binary's bundled SQLite selection.
[features]
default = ["source-analysis", "vector-search"]
bundled-sqlite = ["rusqlite/bundled"]
source-analysis = ["dep:ruff_python_ast", "dep:ruff_python_parser", "dep:ruff_text_size", "dep:proc-macro2", "dep:tree-sitter", "dep:tree-sitter-c", "dep:tree-sitter-cpp", "dep:tree-sitter-javascript", "dep:tree-sitter-python", "dep:tree-sitter-rust", "dep:tree-sitter-typescript"]
vector-search = ["dep:memmap2"]
python = ["dep:pyo3", "source-analysis", "vector-search", "dep:libloading", "dep:sha1"]
python-compat-tests = ["python"]
extension-module = ["python", "pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[package.metadata.maturin]
bindings = "pyo3"


# Do not compile compatibility executables in native-only builds.
# These adapters remain explicitly opt-in until their interpreted callers retire.

