[package]
name = "forge"
version = "0.8.21"
edition = "2021"
description = "Native hooks, resource-aware task execution, audit and cost tooling for AI agents"
autobins = false
build = false

[workspace]
members = ["../forge-cli"]
default-members = [".", "../forge-cli"]
exclude = ["../conductor-native", "../slop-core"]
resolver = "2"

[[bench]]
name = "tool_schema"
harness = false

[[bench]]
name = "code_tools"
harness = false

[[bench]]
name = "process_io"
harness = false

[[bench]]
name = "harness"
harness = false

[[bench]]
name = "context"
harness = false

[[bench]]
name = "lifecycle"
harness = false

[[bench]]
name = "code_index"
harness = false

[[bench]]
name = "real_code_index"
harness = false

[[bench]]
name = "candidate"
harness = false

[[bench]]
name = "candidate_lines"
harness = false

[[bench]]
name = "candidate_execution"
harness = false

[[bench]]
name = "candidate_builtin"
harness = false

[[bench]]
name = "candidate_analysis"
harness = false

[[bench]]
name = "batch_execution"
harness = false

[[bench]]
name = "hook_guard"
harness = false

[[bench]]
name = "local_clerk"
harness = false

[[bench]]
name = "graph_context"
harness = false

[[example]]
name = "outbound_mcp_server"
path = "tests/support/outbound_mcp_server.rs"
test = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
tokio = { version = "1.53.3", features = ["rt", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# Schema bounds must retain exact decimals independently of transitive features.
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order", "float_roundtrip", "raw_value"] }
anyhow = "1"
base64 = "0.22"
cap-std = "4"
slop-core = { path = "../slop-core", default-features = false }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
regex = "1"
walkdir = "2"
ignore = "0.4.34"
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
# Checksum rewritten Git index bytes when discarding the reconstructible TREE cache.
sha1 = "0.10"
libc = "0.2"
landlock = "0.4.7"
toml = "0.8"
yaml-rust2 = { version = "=0.13.0", default-features = false }
# Candidate policy order affects check execution and receipt bindings.
toml_edit = { version = "0.22", default-features = false, features = ["parse"] }
# Native, offline tokenization only; no HTTP client, Python binding or trainer UI.
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
# `bundled` vendors and builds sqlite3 (no system libsqlite3 dependency);
# `bundled` alone compiles FTS5 in on modern rusqlite/libsqlite3-sys, but
# `fts5` is pinned explicitly so a future rusqlite bump can't silently drop
# it -- `forge notes index|search|tables` (notes_index.rs) needs FTS5 and its own
# `fts5_is_available` test fails loud if it is ever missing.
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits"] }
# Share the native plan, receipt and shell-argument algorithms without building
# Python bindings or requiring interpreter discovery during a Forge build.
conductor-native = { path = "../conductor-native", default-features = false, features = ["source-analysis", "vector-search", "bundled-sqlite"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dev-dependencies]
quick-xml = "0.41"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[[bench]]
name = "graph_test_select"
harness = false

[[bench]]
name = "branch_policy"
harness = false
