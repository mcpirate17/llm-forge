[package]
name = "forge"
version = "0.5.0"
edition = "2021"
description = "Native hooks, resource-aware task execution, audit and cost tooling for AI agents"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
regex = "1"
walkdir = "2"
sha2 = "0.10"
libc = "0.2"
toml = "0.8"
# `bundled` vendors and builds sqlite3 (no system libsqlite3 dependency);
# `bundled` alone compiles FTS5 in on modern rusqlite/libsqlite3-sys, but
# `fts5` is pinned explicitly so a future rusqlite bump can't silently drop
# it -- `forge notes index|search` (notes_index.rs) needs FTS5 and its own
# `fts5_is_available` test fails loud if it is ever missing.
rusqlite = { version = "0.32", features = ["bundled"] }
# Share the native plan, receipt and shell-argument algorithms without building
# Python bindings or requiring interpreter discovery during a Forge build.
conductor-native = { path = "../conductor-native", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
