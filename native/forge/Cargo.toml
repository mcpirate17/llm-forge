[package]
name = "forge"
version = "0.1.0"
edition = "2021"
description = "Native launcher for llm-forge's Claude Code hook path -- step 1 of the Rust hook port: a thin binary that delegates to the existing Python dispatcher while later steps move hook logic in natively."

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
walkdir = "2"
sha2 = "0.10"
libc = "0.2"
toml = "0.8"
# `forge mutation plan` calls `compute_plan` directly -- no pyo3 boundary, no
# Python interpreter. conductor-native's default build (no `extension-module`
# feature) still links libpython so its own `cargo test` can run; pulling that
# link into this binary too is an accepted tradeoff over duplicating the
# ~400-line plan algorithm in a second, drift-prone copy (see mutation_plan.rs).
conductor-native = { path = "../conductor-native" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
