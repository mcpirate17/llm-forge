[package]
name = "forge-product-value"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
conductor-native = { path = "../conductor-native", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
