[package]
name = "slop-core"
version = "0.1.13"
edition = "2021"
description = "Native ablation engine — parses Python and emits byte-span edits that remove one construct at a time"

[lib]
name = "slop_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
pyo3 = { version = "0.29" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
tree-sitter = "0.22"
tree-sitter-python = "0.21"
tree-sitter-rust = "0.21"

# `extension-module` tells pyo3 not to link libpython, which is right for the
# shipped wheel and wrong for `cargo test` -- a test binary must link it to run.
[features]
default = []
extension-module = ["pyo3/extension-module"]

[package.metadata.maturin]
bindings = "pyo3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
