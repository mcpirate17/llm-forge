[package]
name = "slop-core"
version = "0.1.13"
edition = "2021"
description = "Native ablation engine — parses Python and emits byte-span edits that remove one construct at a time"

[lib]
name = "slop_core"
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "analysis"
harness = false

[dependencies]
anyhow = "1"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
pyo3 = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
ruff_python_ast = { package = "rustpython-ruff_python_ast", version = "0.15.8" }
ruff_python_parser = { package = "rustpython-ruff_python_parser", version = "0.15.8" }
ruff_text_size = { package = "rustpython-ruff_text_size", version = "0.15.8" }
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"

# `extension-module` tells pyo3 not to link libpython, which is right for the
# shipped wheel and wrong for `cargo test` -- a test binary must link it to run.
[features]
default = []
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[package.metadata.maturin]
bindings = "pyo3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
