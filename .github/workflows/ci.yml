name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow depth-1 clone: the
          # baselines step below needs a real merge base with the PR's base
          # branch to compute the changed-file diff, and a depth-1 checkout
          # has no ancestry to compute one from (`git diff base...HEAD` then
          # fails with "no merge base", exit 128).
          fetch-depth: 0
      # uv's cache (~/.cache/uv) holds the wheels it resolves and builds, so a
      # warm cache turns `uv sync` from "download the world" into hardlinks.
      # Keyed on uv.lock: any dependency bump misses on purpose.
      - name: Cache uv artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      # npm's download cache backs the pinned jscpd global install; keyed on
      # the repo lockfile so an npm dependency change misses deliberately.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install shared SQLite build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev pkg-config
      - run: uv sync --extra test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/forge
      - name: Build native CLI for legacy compatibility entrypoints
        env:
          PYO3_NO_PYTHON: "1"
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo build --locked --manifest-path native/forge/Cargo.toml
          echo "FORGE_BIN=$GITHUB_WORKSPACE/native/forge/target/debug/forge" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/native/forge/target/debug" >> "$GITHUB_PATH"
      - run: uv run python -m pytest src/conductor -q -p no:cacheprovider --timeout 600
      - name: Legacy hook compatibility seams
        run: uv run python -m pytest src/tooling/hooks -q -p no:cacheprovider --timeout 120
      - name: Rust contracts for Python compatibility APIs
        env:
          CARGO_BUILD_JOBS: "2"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          export PYO3_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/.venv/lib/python3.12/site-packages"
          export LD_LIBRARY_PATH="$(uv run --no-sync python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))'):${LD_LIBRARY_PATH:-}"
          uv run --no-sync cargo test --locked --manifest-path native/conductor-native/Cargo.toml \
            --features python-compat-tests --test 'python_contracts_*' -- --test-threads=1
      # candidate-review's "full" profile needs jscpd and pmd on PATH (see
      # [tools.jscpd]/[tools.pmd] in candidate_policy.toml and README.md's
      # "Baselines" section). Both are pinned to the exact version the
      # baselines under src/conductor/*_baseline.json were generated with --
      # bumping either without regenerating its baseline is exactly the drift
      # this step exists to catch.
      - name: Install jscpd (pinned)
        run: npm install --global jscpd@4.2.1
      # The PMD zip is ~a hundred MB of unchanged binaries per run; keyed on
      # the pinned version literal alone, because a version bump must miss
      # (and re-download) rather than restore the previous release under the
      # new pin. No restore-keys for the same reason.
      - name: Cache pmd distribution
        id: pmd
        uses: actions/cache@v4
        with:
          path: /tmp/pmd-dist
          key: pmd-dist-7.27.0
      - name: Install pmd (pinned)
        if: steps.pmd.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o /tmp/pmd.zip \
            https://github.com/pmd/pmd/releases/download/pmd_releases/7.27.0/pmd-dist-7.27.0-bin.zip
          unzip -q /tmp/pmd.zip -d /tmp/pmd-dist
          echo "/tmp/pmd-dist/pmd-bin-7.27.0/bin" >> "$GITHUB_PATH"
      # Forge runs ordinary software quality checks. Host governance policies
      # are optional consumers of these tools and are not Forge's CI contract.
      - name: duplication, complexity and dead-code baselines
        run: |
          export PATH="/tmp/pmd-dist/pmd-bin-7.27.0/bin:$PATH"
          jscpd --version
          pmd --version
          # base candidate order: PR base sha, then the pre-push sha (push
          # events), then HEAD~1 as a last resort for a push with no `before`
          # (e.g. a repo's very first push on a ref). fetch-depth: 0 above
          # means the base's ancestry is already in the local object store,
          # so no extra fetch is needed -- and none is attempted, so a
          # missing object fails loud here instead of a swallowed `|| true`
          # silently diffing against stale or wrong data.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          base="${base:-HEAD~1}"
          if ! merge_base="$(git merge-base "$base" HEAD)"; then
            echo "::error::no merge base between '$base' and HEAD -- checkout fetch-depth is probably too shallow again" >&2
            exit 1
          fi
          git diff --name-only --diff-filter=ACMR "$merge_base" HEAD -- '*.py' > /tmp/changed-python-files.txt
          cat /tmp/changed-python-files.txt
          uv run python -m conductor.run_duplicate_audit --tool jscpd \
            --check --changed-files-from /tmp/changed-python-files.txt
          uv run python -m conductor.run_duplicate_audit --tool pmd-python \
            --check --changed-files-from /tmp/changed-python-files.txt
          # REPO_ROOT is the true host root (conductor.project_paths.host_root()),
          # not this module's package parent, so both the baseline and the scan
          # path are spelled src-relative like the vulture invocation below.
          uv run python -m conductor.radon_complexity check \
            --baseline src/conductor/radon_complexity_baseline.json --path src
          uv run python -m conductor.candidate_review.vulture_audit \
            --baseline src/conductor/vulture_baseline.json \
            --changed-files-from /tmp/changed-python-files.txt src

  # Exercise the shipped receipt and retention tools against their fixtures.
  # Changes to Forge itself do not require mutation campaigns or PASS receipts.
  mutation-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Retention diagnostics inspect repository history.
          fetch-depth: 0
      - name: Cache uv artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Install shared SQLite build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev pkg-config
      - run: uv sync --extra test
      - name: Repo-wide receipt decode canary
        run: uv run python -m conductor.mutation_coverage canary
      # Third question: is the retention sweep still runnable? It crashed on
      # main for a week (the patch-audit predicate grew two arguments) and
      # nothing noticed, because nothing ran it. Dry-run only -- the report is
      # the point. Exit 0 means the sweep ran, however many receipts it would
      # delete (they are supposed to accumulate between sweeps); exit 2 means
      # it could not decide and the job fails; any other exit is a crash and
      # the job fails. Sweeping itself stays a local, human-reviewed act.
      - name: Receipt retention report
        run: make mutation-retention

  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [conductor-native, slop-core, forge]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/${{ matrix.crate }}
      - name: Enforce Python-free Forge builds
        if: matrix.crate == 'forge'
        run: echo 'PYO3_NO_PYTHON=1' >> "$GITHUB_ENV"
      - name: Install shared SQLite build dependency
        if: matrix.crate == 'conductor-native'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev pkg-config
      - name: cargo fmt --check
        working-directory: native/${{ matrix.crate }}
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: native/${{ matrix.crate }}
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: native/${{ matrix.crate }}
        run: cargo test
      - name: Native core without Python bindings
        if: matrix.crate == 'conductor-native'
        working-directory: native/conductor-native
        env:
          PYO3_NO_PYTHON: "1"
          CARGO_BUILD_JOBS: "2"
        run: cargo test --locked --no-default-features --features source-analysis -- --test-threads=1
