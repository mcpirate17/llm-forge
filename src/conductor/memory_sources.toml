# Packaged fallback catalog -- the answer only for a host that ships no catalog
# of its own and names none in `[tool.conductor].memory_sources`.
#
# It is deliberately small and relative-only. Every entry a real host wants is
# host data: it names directories in that host's tree, and often absolute paths
# outside it, which is precisely what must not travel inside a wheel. A host
# takes ownership by writing `conductor/memory_sources.toml`; from that moment
# this file is not read at all. See `conductor.memory_index.host_catalog_path`.
schema_version = 1

[[source]]
id = "cards"
kind = "index"
root = "research/notes"
glob = "kb_*.md"
chunk = "heading"

[[source]]
id = "notes"
kind = "index"
root = "research/notes"
glob = "*.md"
exclude_globs = ["kb_*.md"]
chunk = "heading"

[[source]]
id = "repo-tasks"
kind = "index"
root = "tasks"
glob = "*.md"
chunk = "heading"
