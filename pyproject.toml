[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conductor-tooling"
version = "0.1.0"
description = "Agent governance tooling: mutation campaigns, candidate review, A2A, knowledge retrieval, agent hooks"
requires-python = ">=3.12"
# Exactly the third-party distributions conductor imports (scan of every import at
# every scope against the host's dependency list, 2026-09-02). Host-only crates are
# extras below; nothing here resolves to the host repository.
dependencies = [
  "a2a-sdk[http-server]>=1.1.2",
  "conductor-native",
  "slop-core",
  "coverage>=7.0",
  "defusedxml>=0.7.1",
  "httpx>=0.28",
  "numpy>=1.26",
  "pydantic>=2",
  "pyyaml>=6.0",
  "starlette>=0.45",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# The code-review-graph MCP server that `conductor init` wires into .mcp.json.
graph = ["code-review-graph==2.3.8"]
# Both Rust crates live under native/ and are path sources below. slop-core (the
# ablation engine and test index behind the equivalence probe) is reached only through
# conductor/_native.py, which decides its absence once at import time.

[project.scripts]
conductor = "conductor.__main__:main"
kb_retrieve = "conductor.kb_retrieve:main"
memory_index = "conductor.memory_index:main"
candidate_review = "conductor.candidate_review.cli:main"
mutation_testing = "conductor.mutation_testing:main"
agent_a2a = "conductor.agent_a2a:main"
handoff = "conductor.handoff:main"

[tool.hatch.build.targets.wheel]
packages = ["src/conductor", "src/tooling"]

[tool.uv.sources]
conductor-native = { path = "native/conductor-native" }
slop-core = { path = "native/slop-core" }

# The three Rust sources below are runner components: `mutation_testing.py` hashes
# them into every receipt's `runner_components_sha256`, which is what binds a receipt
# to the code that produced it. It resolves them relative to the installed
# `conductor/` package's parent -- the repo root in a checkout, site-packages in an
# install -- so a wheel that omits them cannot compute the map at all, and every
# mutation command raises `runner component is missing or unsafe`. Shipping the real
# files at the path the resolver already looks in keeps the hashes identical in both
# layouts; a copy under a different name would drift and make the map meaningless.
# 110 KB total.
[tool.hatch.build.targets.wheel.force-include]
"native/conductor-native/src/mutation_evidence.rs" = "tooling/native/conductor-native/src/mutation_evidence.rs"
"native/conductor-native/src/mutation_manifest.rs" = "tooling/native/conductor-native/src/mutation_manifest.rs"
"native/conductor-native/src/mutation_receipt.rs" = "tooling/native/conductor-native/src/mutation_receipt.rs"

# OS prerequisite for conductor.project_context's additive Linux resolver.
# Informational package metadata: pip/uv do not install system executables.
# The resolver fails closed if this fixed executable or its required options
# are unavailable. Portable doctor integration remains extraction tasks T12/T14.
[tool.conductor.runtime-requirements.git]
executable = "/usr/bin/git"
minimum-version = "2.31"
platforms = ["linux"]
required-by = ["conductor.project_context"]
