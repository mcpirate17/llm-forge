[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conductor-tooling"
version = "0.1.0"
description = "Agent governance tooling: mutation campaigns, candidate review, A2A, knowledge retrieval, agent hooks"
requires-python = ">=3.12"
# Exactly the third-party distributions conductor imports (scan of every import at
# every scope against the host's dependency list, 2026-09-02). Host-only crates are
# extras below; nothing here resolves to the host repository.
dependencies = [
  "a2a-sdk[http-server]>=1.1.2",
  "conductor-native",
  "slop-core",
  "coverage>=7.0",
  "defusedxml>=0.7.1",
  # conductor/mutation_engine_fest.py shells out to the `fest` binary this wheel
  # installs. A shipped module that shells out to a tool declares it here, never
  # only in a CI job (KB-CI-01): without it `mutation_engine_generated run` refuses
  # with "fest is not installed" and the mutation routine this package exists to
  # provide cannot run from a clean install at all.
  "fest-mutate>=0.1.3",
  # conductor/ledger_calibrate.py imports anthropic lazily inside its network
  # path (so --offline works without it), but the online calibration path is a
  # shipped feature, not a CI-only step -- declared here per KB-CI-01, the
  # same rule fest-mutate above follows.
  "anthropic>=0.40",
  "httpx>=0.28",
  "numpy>=1.26",
  "pydantic>=2",
  "pyyaml>=6.0",
  # conductor/radon_complexity.py imports radon.complexity at call time, and the
  # complexity ratchet runs in candidate_policy.toml's pre-commit profile -- so it is
  # on the commit path, not merely the audit path. The host declares it for exactly
  # this reason (pyproject.toml); omitting it here is the same KB-CI-01 shape one
  # level down: every developer venv carries it, so a standalone install is the only
  # place the omission is visible.
  "radon>=6.0.1",
  "starlette>=0.45",
  "uvicorn>=0.30",
  # conductor/candidate_review/vulture_audit.py shells out to the `vulture` binary
  # and raises VultureAuditError (fail-closed, not a skip) when it is missing from
  # PATH. That module ships inside src/conductor and is reachable from the
  # `candidate_review` console script, so vulture is a runtime dependency of the
  # shipped package, not a CI-only tool -- KB-CI-01's exact shape.
  "vulture>=2.11",
]

[project.optional-dependencies]
# pytest-timeout backs only the `--timeout` flag used to invoke the test suite; no
# shipped conductor module imports or shells out to it.
test = ["pytest>=8.0", "pytest-timeout>=2.3"]
# fest refuses to mutate anything until it has a coverage map, and it collects one
# by running the campaign's own pytest command under pytest-cov. Kept out of `test`
# because it is the mutation engine's prerequisite, not the suite's.
mutation = ["pytest-cov>=5.0"]
# The code-review-graph MCP server that `conductor init` wires into .mcp.json.
graph = ["code-review-graph==2.3.8"]
# Both Rust crates live under native/ and are path sources below. slop-core (the
# ablation engine and test index behind the equivalence probe) is reached only through
# conductor/_native.py, which decides its absence once at import time.

[project.scripts]
conductor = "conductor.__main__:main"
kb_retrieve = "conductor.kb_retrieve:main"
memory_index = "conductor.memory_index:main"
candidate_review = "conductor.candidate_review.cli:main"
# The mutation front door is the automatic path. `mutation_testing` inspects and
# verifies; it cannot run anything -- the hand runner was removed 2026-09-08.
mutation_testing = "conductor.mutation_testing:main"
mutation_generate = "conductor.mutation_campaign_generate:main"
mutation_engine = "conductor.mutation_engine_generated:main"
agent_a2a = "conductor.agent_a2a:main"
handoff = "conductor.handoff:main"

[tool.hatch.build.targets.wheel]
packages = ["src/conductor", "src/tooling"]

[tool.uv.sources]
conductor-native = { path = "native/conductor-native" }
slop-core = { path = "native/slop-core" }

# Three Rust sources are runner components: `mutation_testing.py` hashes them into
# every receipt's `runner_components_sha256`, which is what binds a receipt to the code
# that produced it. It resolves them relative to the installed `conductor/` package's
# parent -- the repo root in a checkout, site-packages in an install -- so a tree that
# omits them cannot compute the map at all, and every mutation command raises
# `runner component is missing or unsafe`.
#
# They ship as ordinary package data under `src/tooling/native/conductor-native/src/`,
# placed there by the standalone layout in tooling-standalone-smoke. That one copy
# satisfies both layouts at once: the checkout resolves it directly, and the
# `src/tooling` package above carries it into the wheel at the same relative path, so
# the hashes are identical either way. A force-include pointing at the crate under
# native/ would land a *second* file at that same wheel path and hatchling refuses the
# build outright -- the two mechanisms cannot coexist, and package data is the one that
# also fixes the checkout. 110 KB total.

# Where this repository keeps its conductor data. conductor.project_paths reads these
# two keys (env overrides: $CONDUCTOR_CANDIDATE_POLICY, $CONDUCTOR_MUTATION_REGISTRY)
# and every call site resolves through it. Omitting them yields the monorepo layout
# conductor was extracted from -- conductor/candidate_policy.toml and
# conductor/mutation_campaigns/registry.json -- so that host needs no entry here.
[tool.conductor]
candidate_policy = "candidate_policy.toml"
mutation_registry = "campaigns/registry.json"
# Where the conductor package itself sits. The monorepo conductor was extracted from
# keeps it at the repo root, which is the unconfigured default; this repository is a
# src layout, and the governance checks that read their own package -- engine
# integrity, the tooling boundary, base-dependency scope -- resolve it through
# conductor.project_paths rather than spelling "conductor/" out.
package_root = "src/conductor"
# Where a receipt lands when a campaign is run without an explicit `--receipt`. The
# unconfigured default is the monorepo's own scratch tree (`research/reports/...`),
# which this repository does not have; point it at the registered receipts
# directory instead so an ad hoc run has somewhere real to write.
mutation_receipt_root = "campaigns/receipts"
# The integration line conductor.branch_policy, workspace_hygiene and
# candidate_review.git_source resolve their "master"-shaped defaults through
# (env override: $CONDUCTOR_INTEGRATION_BRANCH). The monorepo conductor was
# extracted from names its own line "master"; this repository's is "main", which is
# also the package's unconfigured default -- declared explicitly here so it survives
# the monorepo's convention changing out from under it, the way the 2026-09-05
# `master` lag once did.
integration_branch = "main"
# The knowledge tree kb_retrieve, memory_index's catalog and the notes guards
# read (env override: $CONDUCTOR_NOTES_ROOT). The unconfigured default is the
# monorepo's `research/notes/`, which this repository does not have; this
# repository's own docs are its knowledge base.
notes_root = "docs"

# OS prerequisite for conductor.project_context's additive Linux resolver.
# Informational package metadata: pip/uv do not install system executables.
# The resolver fails closed if this fixed executable or its required options
# are unavailable. Portable doctor integration remains extraction tasks T12/T14.
[tool.conductor.runtime-requirements.git]
executable = "/usr/bin/git"
minimum-version = "2.31"
platforms = ["linux"]
required-by = ["conductor.project_context"]
