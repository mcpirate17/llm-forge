memory_mb = 4096
max_output_chars = 30000

[checks.semgrep-advisory]
kind = "command"
profiles = ["full"]
classes = ["python"]
exclude_classes = ["native"]
# Concurrency and unbounded-state heuristics with real signal but a measured pre-existing
# population (81 over 2998 modules), so MEDIUM and never blocking. A command check emits
# ONE blob finding at the check's own severity, which is why these need their own ruleset
# and their own check rather than a severity field inside .semgrep.yml.
command = [
  "semgrep",
  "scan",
  "--no-git-ignore",
  "--jobs",
  "1",
  "--max-memory",
  "2048",
  "--config",
  ".semgrep-advisory.yml",
  "--error",
  "{files}",
]
version_command = ["semgrep", "--version"]
cache = true
severity = "medium"
timeout_seconds = 300
memory_mb = 4096
max_output_chars = 30000

[checks.detect-secrets]
