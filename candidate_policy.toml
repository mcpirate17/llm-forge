classes = ["python"]
required_profiles = ["full"]

# ---------------------------------------------------------------------------
# Declared external tool set, 2026-08-29.
#
# `make gate` probes every entry here BEFORE it starts work and refuses to run when
# one is absent. This exists because "green locally" meant nothing during the
# 2026-08-26/29 landing: the local box had tools the runner lacked and vice versa,
# and each mismatch surfaced one CI cycle at a time.
#
# `command_runner` already fails closed on a missing analyzer for policy `command`
# checks -- but only after the review has materialized a snapshot and run every cheap
# check, and `prlimit` was exempt even from that, silently returning an unbounded
# command and dropping the CPU and address-space budget entirely. That is why
# `prlimit`, `git` and `uv` are declared here even though no `[checks.*]` names them.
#
# `expected_version` is CI's pin (see .github/workflows/governance-ci.yml). A local
# version that differs is REPORTED, not refused: version skew is worth knowing, a
# missing tool is what actually breaks the run.
# ---------------------------------------------------------------------------

[tools.ruff]
executable = "ruff"
version_command = ["ruff", "--version"]
expected_version = "0.15.20"
required_profiles = ["fast", "full"]
provided_by = "uv pip install ruff==0.15.20"
rationale = "checks.ruff-check and checks.ruff-format"

