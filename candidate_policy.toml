# llm-forge candidate policy.
#
# Derived from the monorepo conductor was extracted from: the generic checks, tool
# declarations and thresholds, with every host-specific exception, mutation waiver,
# value waiver and provenance entry dropped -- those excused code that does not exist
# here, and an inert exception reads as live coverage. [classes], [risk] and [paths]
# name this repository's layout (src/conductor, native/, campaigns/).
#
# pyproject.toml's [tool.conductor] points at this file; see conductor.project_paths.

schema_version = 1
block_at = "high"
max_workers = 4
cache_ttl_days = 14
claim_max_age_hours = 24
max_file_bytes = 1000000
max_binary_bytes = 5000000
coverage_threshold = 40.0
high_risk_coverage_threshold = 65.0
baseline_expires = 2026-09-15
[classes]
governance = [
  "src/conductor/**",
  "src/tooling/hooks/**",
  ".claude/**",
  ".github/workflows/**",
  ".pre-commit-config.yaml",
  "Makefile",
]
workflow = [".github/workflows/**", ".pre-commit-config.yaml"]
# `novel` is what arms [checks.research-integrity]. llm-forge has no research tree of
# its own yet, but the check ships here and its tests pin these directory names, so the
# class is declared rather than dropped -- a glob that matches nothing costs nothing.
novel = ["component_fab/**", "research/**"]

[risk]
high = [
  "src/conductor/**",
  "src/tooling/hooks/**",
  ".claude/**",
  ".github/workflows/**",
  ".pre-commit-config.yaml",
  "native/**",
]

[paths]
# This repository's own entries first; the trailing globs name directories llm-forge
# does not have, kept because the shipped checks' tests pin them (a glob that matches
# nothing costs nothing, and dropping them would silently retire the check).
protected_deletes = [
  "campaigns/receipts/**",
  "research/runtime_events/**",
  "research/perf_artifacts/**",
  "research/db_backups/**",
  "research/data/**",
  "**/*champion*.json",
  "**/*promotion*.jsonl",
]
hot = [
  "native/**",
  "component_fab/harness/**",
  "research/synthesis/**",
  "**/kernels/**",
  "**/training*.py",
  "**/trainer*.py",
]
generated = [
  "**/generated/**",
  "**/*.generated.*",
  "research/reports/**",
  "tasks/audit/**",
]

[checks.candidate-integrity]
kind = "builtin"
profiles = ["fast", "full"]
classes = []
always = true
cache = false
run_on_deletions = true
severity = "critical"
timeout_seconds = 30
memory_mb = 512
max_output_chars = 12000

[checks.ownership]
kind = "builtin"
profiles = ["fast", "full"]
classes = []
always = true
cache = false
run_on_deletions = true
severity = "high"
timeout_seconds = 30
memory_mb = 512
max_output_chars = 12000

[checks.secret-scan]
kind = "builtin"
profiles = ["fast", "full"]
classes = []
always = true
cache = true
severity = "critical"
timeout_seconds = 60
memory_mb = 1024
max_output_chars = 12000

[checks.config-parse]
kind = "builtin"
# attribution = "diff": this check judges the candidate's changed files, so a
# finding naming an unchanged path (or no path) is pre-existing tree debt. It is
# reported and counted, but does not block. A candidate that cannot pass by doing
# its own work well gets bypassed rather than obeyed -- see conductor/gate_rollout.md.
attribution = "diff"
profiles = ["fast", "full"]
classes = ["config", "notebook", "workflow"]
cache = true
severity = "critical"
timeout_seconds = 60
memory_mb = 1024
max_output_chars = 12000

[checks.equivalence-probe]
kind = "builtin"
profiles = ["full"]
classes = ["python"]
cache = true
severity = "low"
timeout_seconds = 600

[checks.python-ast]
kind = "builtin"
# attribution = "diff": this check judges the candidate's changed files, so a
# finding naming an unchanged path (or no path) is pre-existing tree debt. It is
# reported and counted, but does not block. A candidate that cannot pass by doing
# its own work well gets bypassed rather than obeyed -- see conductor/gate_rollout.md.
attribution = "diff"
profiles = ["fast", "full"]
classes = ["python"]
cache = true
severity = "high"
timeout_seconds = 90
memory_mb = 2048
max_output_chars = 12000

[checks.native-source]
kind = "builtin"
# attribution = "diff": this check judges the candidate's changed files, so a
# finding naming an unchanged path (or no path) is pre-existing tree debt. It is
# reported and counted, but does not block. A candidate that cannot pass by doing
# its own work well gets bypassed rather than obeyed -- see conductor/gate_rollout.md.
attribution = "diff"
profiles = ["fast", "full"]
classes = ["native"]
cache = true
severity = "critical"
timeout_seconds = 60
memory_mb = 1024
max_output_chars = 12000

[checks.crate-version]
kind = "builtin"
# attribution = "candidate": every finding names a manifest of a crate this
# candidate edited, so there is no pre-existing-debt shape to inherit.
profiles = ["fast", "full"]
classes = ["native"]
cache = false
severity = "critical"
timeout_seconds = 30
memory_mb = 512
max_output_chars = 8000

[checks.dependency-integrity]
kind = "builtin"
profiles = ["fast", "full"]
classes = ["dependency"]
cache = true
run_on_deletions = true
severity = "critical"
timeout_seconds = 60
memory_mb = 1024
max_output_chars = 12000

[checks.import-declaration]
kind = "builtin"
# attribution = "diff": the rule judges the imports of the files this candidate
# changed. A finding on an unchanged path is pre-existing tree debt -- recorded,
# but not a wall in front of unrelated work.
attribution = "diff"
profiles = ["fast", "full"]
classes = ["python"]
cache = true
severity = "critical"
timeout_seconds = 90
memory_mb = 1024
max_output_chars = 12000

[checks.duplicate-function-bodies]
kind = "builtin"
# attribution = "diff": this check judges the candidate's changed files, so a
# finding naming an unchanged path (or no path) is pre-existing tree debt. It is
# reported and counted, but does not block. A candidate that cannot pass by doing
# its own work well gets bypassed rather than obeyed -- see conductor/gate_rollout.md.
attribution = "diff"
profiles = ["fast", "full"]
classes = ["python"]
cache = true
severity = "high"
timeout_seconds = 180
memory_mb = 4096
max_output_chars = 12000

[checks.structure-audit]
kind = "builtin"
profiles = ["fast", "full"]
classes = ["python"]
cache = true
severity = "high"
timeout_seconds = 180
memory_mb = 4096
max_output_chars = 20000

[checks.tooling-boundary]
kind = "command"
profiles = ["fast", "full"]
classes = ["python"]
# The tooling boundary contract (conductor/tooling_boundary.py): no import edge from
# conductor/ to a host package at any scope, no host path literal in conductor/ or the
# generic hooks, and conductor/_native.py the only native seam. Always on because a
# coupling can enter through any file class; runs against the snapshot, not the tree.
always = true
command = [
  "{python}",
  "-m",
  "conductor.tooling_boundary",
  "--root",
  "{snapshot}",
]
version_command = ["{python}", "--version"]
cache = false
severity = "high"
timeout_seconds = 120
memory_mb = 2048
max_output_chars = 20000

[checks.forbid-repo-root-junk]
kind = "command"
profiles = ["fast", "full"]
# Repo root is config only (CLAUDE.md). Rejects *PLAN*.md, *HANDOFF*.md, *.log,
# metrics.jsonl and unused.* directly at the root, and explicitly allows the
# user-blessed *DO_NOT_DELETE* files. No class filter: the junk it rejects is
# markdown and log output, which belong to no source class. Deletions are exempt
# -- removing a junk file is the fix, not a violation.
command = ["{python}", "-m", "conductor.check_root_junk", "{files}"]
version_command = ["{python}", "--version"]
cache = true
severity = "high"
timeout_seconds = 60
memory_mb = 512
max_output_chars = 4000

[checks.forbid-json-in-notes]
kind = "command"
profiles = ["fast", "full"]
# research/notes/ is the knowledge tree; bulk data is not knowledge. Rejects
# .json/.jsonl/.csv directly inside it -- research/data/ for persistent inputs,
# research/reports/ or tasks/audit/ for tool output. Subdirectories are exempt
# by design: they are curated collections, not loose data drops.
command = ["{python}", "-m", "conductor.check_json_in_notes", "{files}"]
version_command = ["{python}", "--version"]
cache = true
severity = "high"
timeout_seconds = 60
memory_mb = 512
max_output_chars = 4000


[checks.require-generated-mutants]
kind = "command"
profiles = ["fast", "full"]
# New mutation campaigns must be generated, never hand-written. An agent that
# picks its own mutants scores the damage it chose: 482 of 483 hand-authored
# campaigns publish exactly 1.0 while a mechanical sweep of the same code kills
# 60.6% (conductor/mutation_engine_generated.py). Rejects a campaign MANIFEST
# whose mutation_engine is not one the runner can execute AND which did not
# exist at {base}. The admitted set is read from GENERATED_ENGINES, so it cannot
# drift from the adapters. The legacy hand-written campaigns already in the tree
# are archival provenance, never an executable fallback: the driver that used to
# re-pin them was deleted on 2026-09-08, so when a source edit rots one the cure
# is to RETIRE it -- drop the registry row, the manifest, its patches and its
# receipts -- and re-record the corpus baseline. Deleting one is never an
# offence. CRITICAL because a hand-authored campaign is the student grading its
# own test; there is no severity at which it is acceptable.
command = [
  "{python}",
  "-m",
  "conductor.check_generated_mutants",
  "--repo",
  "{repo}",
  "--base",
  "{base}",
  "{files}",
]
version_command = ["{python}", "--version"]
cache = true
severity = "critical"
timeout_seconds = 60
memory_mb = 512
max_output_chars = 4000

[checks.ruff-check]
kind = "command"
profiles = ["fast", "full"]
classes = ["python", "notebook"]
command = ["ruff", "check", "--no-cache", "{files}"]
version_command = ["ruff", "--version"]
cache = true
severity = "high"
timeout_seconds = 120
memory_mb = 4096
max_output_chars = 20000

[checks.ruff-format]
kind = "command"
profiles = ["fast", "full"]
classes = ["python", "notebook"]
command = ["ruff", "format", "--check", "--no-cache", "{files}"]
version_command = ["ruff", "--version"]
cache = true
severity = "high"
timeout_seconds = 120
memory_mb = 4096
max_output_chars = 20000

[checks.ruff-lifecycle]
kind = "command"
profiles = ["fast", "full"]
classes = ["python", "notebook"]
# Measured 0 findings over the tracked modules, so this blocks from the day it lands and
# every finding is a regression. The B*/RUF006 half is now redundant -- ruff.toml selects
# all eight, and CI runs `ruff check .` over the whole tree rather than a rule set of its
# own -- and the ASYNC half has been promoted there too. Kept because this runs per
# candidate file with its own severity and timeout, which the tree-wide job does not;
# it is a duplicate check, not a second rule set, so the two cannot disagree.
command = [
  "ruff",
  "check",
  "--no-cache",
  "--select",
  "B003,B006,B012,B019,B024,B027,B039,RUF006,ASYNC100,ASYNC110,ASYNC210,ASYNC212,ASYNC220,ASYNC221,ASYNC222,ASYNC230,ASYNC240,ASYNC251",
  "{files}",
]
version_command = ["ruff", "--version"]
cache = true
severity = "high"
timeout_seconds = 120
memory_mb = 4096
max_output_chars = 20000

[checks.ruff-lifecycle-advisory]
kind = "command"
profiles = ["full"]
classes = ["python", "notebook"]
# Same families, the two rules with a measured pre-existing population (RUF012 mutable
# class default: 51, SIM115 unclosed file: 7). Advisory until that debt is paid down,
# then fold them into [checks.ruff-lifecycle].
command = [
  "ruff",
  "check",
  "--no-cache",
  "--select",
  "SIM115,RUF012",
  "{files}",
]
version_command = ["ruff", "--version"]
cache = true
severity = "medium"
timeout_seconds = 120
memory_mb = 4096
max_output_chars = 20000

[checks.pyright]
kind = "command"
profiles = ["fast", "full"]
classes = ["python"]
command = ["pyright", "--level", "error", "{files}"]
version_command = ["pyright", "--version"]
cache = true
severity = "high"
timeout_seconds = 300
memory_mb = 8192
max_output_chars = 30000

[checks.bandit]
kind = "command"
profiles = ["fast", "full"]
classes = ["python"]
exclude_classes = ["test"]
command = [
  "bandit",
  "-q",
  "--severity-level",
  "medium",
  "--confidence-level",
  "medium",
  "--skip",
  # B614 (torch.load without weights_only): the W7 lane instruments load their own
  # sha256-pinned state bundles; skipped 2026-08-27 for the linear-integration landing,
  # revisit with weights_only=True migration (tracked post-landing debt).
  "B608,B614",
  "{files}",
]
version_command = ["bandit", "--version"]
cache = true
severity = "high"
timeout_seconds = 180
memory_mb = 4096
max_output_chars = 20000

[checks.semgrep]
kind = "command"
profiles = ["fast", "full"]
classes = ["python", "web", "workflow"]
exclude_classes = ["test", "native"]
command = [
  "semgrep",
  "scan",
  "--no-git-ignore",
  "--jobs",
  "1",
  "--max-memory",
  "2048",
  "--config",
