[checks.cargo-fmt]
# CI formats every crate on every native change; the gate formats the crates the
# candidate touched, with the same command. The crate roster is
# tooling/native/crates.toml, which the CI job reads too, so a crate cannot be
# formatted in one place and not the other.
kind = "command"
profiles = ["fast", "full"]
classes = ["rust", "rust_dependency"]
command = [
  "{python}",
  "-m",
  "conductor.candidate_review.cargo_lint_files",
  "--mode",
  "fmt",
  "{files}",
]
version_command = [
  "{python}",
  "-m",
  "conductor.candidate_review.cargo_lint_files",
  "--mode",
  "fmt",
  "--version",
]
cache = true
severity = "high"
timeout_seconds = 300
memory_mb = 4096
max_output_chars = 20000

[checks.cargo-clippy]
# `full` only: clippy has to compile, so unlike cargo-fmt it is minutes, not
# seconds. A crate whose build.rs needs an artifact that is not in the checkout
# (aria-scheduler's C archive) is skipped with the build command on stderr
# rather than failed -- CI builds it before linting, so nothing is lost there.
kind = "command"
profiles = ["full"]
classes = ["rust", "rust_dependency"]
command = [
  "{python}",
  "-m",
  "conductor.candidate_review.cargo_lint_files",
  "--mode",
  "clippy",
  "{files}",
]
version_command = [
  "{python}",
  "-m",
  "conductor.candidate_review.cargo_lint_files",
  "--mode",
  "clippy",
  "--version",
]
cache = true
severity = "high"
timeout_seconds = 900
memory_mb = 8192
max_output_chars = 30000

[checks.clang-format]
# The 125 host C/C++ files match no base clang-format style -- measured, see
# .clang-format -- so this is line-scoped: {base} lets the wrapper ask git which
# lines the candidate wrote and pass them as --lines. The tree converges file by
# file as people edit it, instead of in one unreviewed sweep.
#
# .cu/.cuh are excluded by class: clang parses CUDA only with a toolkit and
# --cuda-gpu-arch, which is not a formatter's business.
kind = "command"
profiles = ["fast", "full"]
classes = ["cfamily_host"]
command = [
  "{python}",
  "-m",
  "conductor.candidate_review.clang_files",
  "--mode",
  "format",
  "--base",
  "{base}",
  "{files}",
]
version_command = [
  "{python}",
  "-m",
  "conductor.candidate_review.clang_files",
  "--mode",
  "format",
  "--version",
]
cache = true
severity = "high"
timeout_seconds = 300
memory_mb = 4096
max_output_chars = 20000

[checks.clang-tidy]
# Line-scoped the same way, via -line-filter. No CMake build in this tree emits
# a compile_commands.json yet, so today every file is skipped with that reason
# on stderr -- a linter that reports missing headers as errors is noise, and
# guessing include paths is how you get it. Configure any build with
# -DCMAKE_EXPORT_COMPILE_COMMANDS=ON and this starts reporting with no edit here.
kind = "command"
profiles = ["full"]
classes = ["cfamily_host"]
command = [
  "{python}",
  "-m",
  "conductor.candidate_review.clang_files",
  "--mode",
  "tidy",
  "--base",
  "{base}",
  "{files}",
]
version_command = [
  "{python}",
  "-m",
  "conductor.candidate_review.clang_files",
  "--mode",
  "tidy",
  "--version",
]
cache = true
severity = "high"
timeout_seconds = 900
memory_mb = 8192
max_output_chars = 30000

[checks.complexity]
# The ratchet runs in BOTH profiles: pre-commit uses --profile fast, so a new or
# worsened D-F block is refused at the commit, not discovered a branch later.
# A full four-tree radon scan costs ~4s, so scoping it to changed files would buy
# nothing and would blind the check to a grandfathered block that regressed.
kind = "command"
profiles = ["fast", "full"]
classes = ["python"]
command = [
  "{python}",
  "-m",
  "conductor.radon_complexity",
  "check",
  "--baseline",
  "conductor/radon_complexity_baseline.json",
  "--path",
  ".",
]
version_command = ["radon", "--version"]
cache = true
severity = "high"
timeout_seconds = 120
memory_mb = 2048
max_output_chars = 30000

[checks.style-scan]
# The three concerns with no detector anywhere: "no effort-signaling code" (no
# Python linter reads comments -- ruff discards them before it starts), dead
# scaffolding (ruff's dead-code rules stop at unused *names*, so a stub body, an
# unreachable statement and a constant condition all pass), and a name for
# something outside this repository written into the call that uses it -- a
# host, a port, an id -- which no linter has an opinion about at all.
#
# The rules are tree-sitter over the whole file, in Rust; this entry is the
# argv. Line-scoped like clang-format, and for the same reason: the rules find
# 129 pre-existing findings across the 3303 tracked Python files, and reporting
# those would red-gate a candidate for lines it never touched. {base} lets the
# wrapper ask git which lines this candidate wrote and drop the rest, so the
# tree converges as people edit it.
kind = "command"
profiles = ["fast", "full"]
classes = ["python"]
command = [
  "{python}",
  "-m",
  "conductor.candidate_review.style_scan",
  "--base",
  "{base}",
  "{files}",
]
version_command = [
  "{python}",
  "-m",
  "conductor.candidate_review.style_scan",
  "--version",
]
cache = true
severity = "high"
timeout_seconds = 300
memory_mb = 4096
max_output_chars = 20000

[checks.rust-style-scan]
# "Fail loud" in the language the compute is written in. `.unwrap()` does not
# hide an error, it discards the reason and aborts: the backtrace names
# core::option rather than the call that was wrong. `todo!()` and
# `unimplemented!()` are scaffolding that type-checks, so nothing else in the
# toolchain notices them. clippy has lints for both, but they are `full`-only
# here because clippy compiles -- this is tree-sitter, 0.2 s over all 127
# tracked Rust files, so it fires ahead of the commit.
#
# Test scope is read from `#[cfg(test)]` and `#[test]` rather than from the
# path: of the 332 `.unwrap()` calls in non-test-path files, 294 are inside an
# inline test module and only 38 are production. `.expect("why")` is allowed --
# it fails as loudly and carries the reason, which is all the rule asks for.
# Line-scoped like style-scan, so those 38 land on whoever next edits them.
kind = "command"
profiles = ["fast", "full"]
classes = ["rust"]
command = [
  "{python}",
  "-m",
  "conductor.candidate_review.style_scan",
