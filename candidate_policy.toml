max_output_chars = 100000

[checks.targeted-tests-full]
kind = "builtin"
profiles = ["full"]
classes = ["python", "native"]
cache = false
severity = "high"
timeout_seconds = 1200
memory_mb = 32768
max_output_chars = 50000
# A large integration candidate selects tests from every changed file: PR #38
# changed 2359 files and selected 451 of the repo's 1029 test files, a ~5.5h
# sweep that a single 1200s-CPU process cannot finish -- it was SIGKILLed at 6%.
# Sharding runs each chunk as its own subprocess, so prlimit applies the budget
# per shard. 451 files -> 23 shards at ~72% of budget each. Selections at or
# below shard_max_files run as one process on the unsharded path, unchanged.
#
# 20 -> 10 on 2026-08-29: ~72% of budget was an AVERAGE, and the shards are not
# uniform. On PR #40, shard13 drew four component_fab tests, test_pipeline_-
# integration and three nm_f6 phase-22 files into one chunk and hit TimeoutExpired
# at the full 1200s. Halving the chunk is the conservative correction: the
# per-shard CPU budget is UNCHANGED and no test is skipped, so the gate still
# bites exactly as hard -- only the work per subprocess drops. If a shard times
# out again, halve again rather than raising timeout_seconds; a slow shard is a
# packing problem, and raising the budget is the one change that would let a
# genuinely hanging test through.
shard_max_files = 10
shard_workers = 4
# Wall budget, separate from the 1200s CPU budget above. MEASURED 2026-08-29: shard5
# held test_algebraic_properties, whose test_tropical_calibration_pure_order_statistics_
# flag alone costs 136s of a 153s file on a 32-core box; the shard's other nine files
# total 86s CPU. On a 4-vCPU runner each of the 4 concurrent shards gets ~1 core, so
# that shard needs roughly 600-800s of wall and blew the 1200s ceiling once coverage
# and runner slowness were added. It was never looping -- prlimit --cpu never fired.
# Raising THIS does not relax hang detection: timeout_seconds still caps CPU at 1200s,
# so a runaway test is still killed on exactly the old budget. The job's 180m cap is
# the backstop for a test that sleeps without burning CPU.
wall_timeout_seconds = 2400

